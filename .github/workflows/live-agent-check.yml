# Live agent release check (internal operations notes; kept out of the public README).
#
# When it runs: on a published plugin release, by manual dispatch, Mondays at 06:23 UTC, and at
# minute 17 of every hour, when the latest @counterfact-labs/cli version on npm differs from the
# last attempted analysis. The attempted version is cached even if the analysis fails, so hourly
# polls do not retry a failing version; weekly, manual, and release runs do retry. Release runs
# cache on their tag ref, which scheduled runs cannot read, so the next hourly poll may repeat.
#
# What it does: installs pinned Claude Code and Codex, installs the published plugin and CLI,
# and has each agent analyze the fictional agent in scripts/fixtures/live-agent with
# --max-dollars 5 (Counterfact estimates only; provider charges are separate) and a 900-second
# deadline per command. Only the paid job joins the concurrency group. Both agents must produce
# MCP completion evidence, a CLI summary, a matching console upload receipt, and a findings URL.
#
# Secrets (Actions secrets in this repo): ANTHROPIC_API_KEY, OPENAI_API_KEY, and
# COUNTERFACT_LIVE_TEST_KEY (the smoke@ test account's CLI key). Missing secrets produce a
# warning that names them; values are never printed.
#
# Local use: scripts/live-agent-check.sh check previews commands without network calls;
# scripts/live-agent-check.sh run --confirm-paid --max-dollars 5 runs it. Offline tests:
# node --test --test-concurrency=4 scripts/*.test.mjs (the workflow test needs PyYAML).

name: Live agent release analysis

on:
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  poll:
    name: Poll CLI release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      run: ${{ steps.cli.outputs.run }}
      version: ${{ steps.cli.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check required secrets
        id: credentials
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COUNTERFACT_LIVE_TEST_KEY: ${{ secrets.COUNTERFACT_LIVE_TEST_KEY }}
        run: |
          set +x
          printf 'LIVE_AGENT_VERSION_FILE=%s/live-agent-version/last-version\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          missing=()
          for name in ANTHROPIC_API_KEY OPENAI_API_KEY COUNTERFACT_LIVE_TEST_KEY; do
            value="${!name}"
            if [[ -z "${value//[[:space:]]/}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            printf '::warning::Skipping live agent analysis: missing required secret(s): %s\n' "${missing[*]}"
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.credentials.outputs.ready == 'true'
        with:
          node-version: '22'

      - name: Restore last attempted CLI version
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        if: steps.credentials.outputs.ready == 'true'
        with:
          path: ${{ env.LIVE_AGENT_VERSION_FILE }}
          key: live-agent-cli-version-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: live-agent-cli-version-v1-

      - name: Compare published CLI version
        id: cli
        if: steps.credentials.outputs.ready == 'true'
        timeout-minutes: 2
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          latest="$(npm view @counterfact-labs/cli version)"
          if [[ ! "$latest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::npm did not return a valid CLI release version'
            exit 1
          fi
          previous=''
          if [[ -f "$LIVE_AGENT_VERSION_FILE" ]]; then
            previous="$(cat "$LIVE_AGENT_VERSION_FILE")"
          fi
          printf 'version=%s\n' "$latest" >> "$GITHUB_OUTPUT"
          # The cron definition owns the minute; only hourly runs skip unchanged versions.
          if [[ "$GITHUB_EVENT_NAME" == 'schedule' && "$EVENT_SCHEDULE" == *' * * * *' && "$previous" == "$latest" ]]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

  live:
    name: Live agent analysis
    needs: poll
    if: needs.poll.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # No-op polls never enter the paid group or replace its pending job.
    concurrency:
      group: live-agent-check
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Initialize version state
        run: printf 'LIVE_AGENT_VERSION_FILE=%s/live-agent-version/last-version\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install pinned coding agents
        timeout-minutes: 10
        run: npm install --global @anthropic-ai/claude-code@2.1.312 @openai/codex@0.165.0

      - name: Run live agent analysis
        id: analysis
        timeout-minutes: 65
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COUNTERFACT_LIVE_TEST_KEY: ${{ secrets.COUNTERFACT_LIVE_TEST_KEY }}
        run: |
          set +x
          scripts/live-agent-check.sh run --confirm-paid --max-dollars 5 \
            --agent-dir "$GITHUB_WORKSPACE/scripts/fixtures/live-agent" --timeout-seconds 900

      - name: Record attempted CLI version
        id: remember
        if: always() && needs.poll.outputs.run == 'true' && steps.analysis.outcome != 'skipped'
        env:
          CLI_VERSION: ${{ needs.poll.outputs.version }}
        run: |
          mkdir -p "$(dirname "$LIVE_AGENT_VERSION_FILE")"
          printf '%s\n' "$CLI_VERSION" > "$LIVE_AGENT_VERSION_FILE"

      - name: Save last attempted CLI version
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        if: always() && needs.poll.outputs.run == 'true' && steps.remember.outcome == 'success'
        with:
          path: ${{ env.LIVE_AGENT_VERSION_FILE }}
          key: live-agent-cli-version-v1-${{ github.run_id }}-${{ github.run_attempt }}
