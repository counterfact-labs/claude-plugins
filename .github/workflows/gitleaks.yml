name: Gitleaks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Scan the new commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: |
          set -euo pipefail
          git cat-file -e "$HEAD_SHA^{commit}"
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            # A new branch has no earlier tip; every reachable commit was pushed.
            log_range="$HEAD_SHA"
          else
            git cat-file -e "$BASE_SHA^{commit}"
            log_range="$BASE_SHA..$HEAD_SHA"
          fi
          # Git-mode fingerprints include the commit. Exempt only the reviewed fake
          # value; replacing it at the same path/line must still fail the scan.
          fixture='scripts/fixtures/live-agent-credential/system_prompt.md'
          while read -r commit; do
            if ! line="$(git show "$commit:$fixture" 2>/dev/null | sed -n '12p')"; then
              continue
            fi
            digest="$(printf '%s' "$line" | sha256sum)"
            if [[ "${digest%% *}" == '475d94c6a2c22dfb82b62133b9fc0d551344b5cfde9ad57f58de98f97ea18987' ]]; then
              printf '%s:%s:github-pat:12\n' "$commit" "$fixture" >> .gitleaksignore
            fi
          done < <(git rev-list "$log_range")
          # Released March 20, 2026 (Pacific); pin bytes as well as the version.
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact=100 --log-opts="--full-history --diff-merges=first-parent $log_range"
